name: Deploy

# Deploys the Worker (API + web app) to Cloudflare after CI-quality checks pass on main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify
        run: pnpm exec turbo run typecheck test
      - name: Licensed fonts (optional)
        env:
          FONTS: ${{ secrets.MARQUM_FONTS_TGZ_BASE64 }}
        if: env.FONTS != ''
        run: mkdir -p apps/web/src/fonts/licensed && echo "$FONTS" | base64 -d | tar -xz -C apps/web/src/fonts/licensed
      - name: Build web
        run: pnpm --filter @marqum/web build
      - name: Migrate D1
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply marqum --remote
      - name: Deploy Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS https://marqum.arqam-mzia.workers.dev/api/health && exit 0
            sleep 5
          done
          exit 1
